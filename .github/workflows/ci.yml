name: CommLab checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: commlab
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: commlab
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U commlab" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4.3-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python -m pytest -q
        working-directory: backend
      - run: alembic upgrade head && python -m pytest tests/test_postgres_queue.py -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://commlab:test-only@localhost:5432/commlab
          REDIS_URL: redis://localhost:6379/0
          COMMLAB_TEST_POSTGRES: "1"
      - run: python scripts/export_openapi.py
        working-directory: backend
      - run: npm ci && npm run types && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- docs/openapi.json frontend/src/api/schema.ts
