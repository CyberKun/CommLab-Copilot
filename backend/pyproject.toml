[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commlab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.156.0", "starlette==1.3.1", "uvicorn==0.34.2", "pydantic==2.11.4",
  "sqlalchemy==2.0.40", "psycopg[binary]==3.2.9", "alembic==1.15.2",
  "pgvector==0.4.1", "dramatiq[redis]==1.18.0", "numpy==2.2.5",
  "scipy==1.15.3", "python-multipart==0.0.32", "pypdf==6.21.1",
  "httpx==0.28.1", "prometheus-client==0.21.1", "matplotlib==3.10.3"
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["commlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
