# Free demo: one web instance with separate API and outbox-worker processes.
# Uses the owner's dedicated Neon database; no expiring Render database.
services:
  - type: web
    name: commlab-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: python -m commlab.hosted
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Enter the Neon direct connection URL in Render, never Git.
      - key: ARTIFACT_BACKEND
        value: database
      - key: METRICS_TOKEN
        generateValue: true
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
